name: Multiplayer and Regression CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/multiplayer-ci.yml'
      - 'web/**'
      - 'runtime/**'
      - 'app/registry-defaults.txt'
      - 'tools/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/multiplayer-ci.yml'
      - 'web/**'
      - 'runtime/**'
      - 'app/registry-defaults.txt'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust, web and multiplayer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/server-rs -> target

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check TypeScript
        working-directory: web
        run: npm run check

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Build server and run Rust workspace tests
        run: bash web/server-rs/build.sh --test

      - name: Install Chromium for browser-based tests
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run web regression tests
        run: |
          mkdir -p out/ci
          node --test --test-concurrency=1 web/test/*.test.mjs 2>&1 | tee out/ci/web-tests.log

      - name: Keep test log if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-ci-failure-log
          path: out/ci/web-tests.log
          if-no-files-found: ignore
          retention-days: 7
