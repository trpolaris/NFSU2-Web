name: Multiplayer and Regression CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'integration/**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/multiplayer-ci.yml'
      - 'web/**'
      - 'runtime/**'
      - 'app/registry-defaults.txt'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/multiplayer-ci.yml'
      - 'web/**'
      - 'runtime/**'
      - 'app/registry-defaults.txt'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multiplayer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust, web and multiplayer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/server-rs -> target

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config

      - name: Check WASI runtime sources with production SDK and target flags
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux"
          archive="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux.tar.gz"
          if [[ ! -x "$sdk_dir/bin/clang" ]]; then
            curl -fsSL --retry 3 --retry-all-errors \
              https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
              -o "$archive"
            tar -xzf "$archive" -C "$RUNNER_TEMP"
          fi
          WASI="$sdk_dir"
          CC="$WASI/bin/clang"
          "$CC" --version
          # Keep this in lockstep with web/build.sh: real wasm32-wasip1-threads
          # target, runtime compatibility headers, WASI emulation defines and
          # production feature flags. The full game-module link still needs the
          # user's own SPEED2.EXE to generate gen/all and gen/server.
          WASI="$WASI" web/tools/aliasguard.sh
          flags=(
            --target=wasm32-wasip1-threads -pthread -O3
            -msimd128 -mbulk-memory -mnontrapping-fptoint -mtail-call
            -mexception-handling -mllvm -wasm-enable-sjlj
            -mllvm -wasm-use-legacy-eh=false
            -D_WASI_EMULATED_MMAN -D_WASI_EMULATED_SIGNAL
            -D_WASI_EMULATED_PROCESS_CLOCKS -fno-delete-null-pointer-checks
            -include runtime/web/compat/wasm_plat.h
            -Iruntime/web/compat -Iruntime -Igen/all
            -Wno-unused-label -Wno-parentheses-equality
            -DNFS_ENHANCED=0
          )
          for source in runtime/com.c runtime/mpcredit.c runtime/mpcredit_store.c; do
            object="$RUNNER_TEMP/$(basename "${source%.c}").wasm.o"
            echo "Compile $source -> $object"
            "$CC" "${flags[@]}" -c "$source" -o "$object"
          done
          # Run the same license-plate texture and Free Roam HELLO tests as native, on the production WASI target.
          "$CC" "${flags[@]}" tests/plates_unit.c runtime/plate_image.c runtime/roam_core.c -lm \
            -Wl,--import-memory,--export-memory,--shared-memory,--initial-memory=67108864,--max-memory=268435456 \
            -Wl,-z,stack-size=8388608 -o "$RUNNER_TEMP/plates_unit.wasm"
          node web/test/wasi-run.mjs "$RUNNER_TEMP/plates_unit.wasm"

      - name: Link-check WASI compatibility and mprace API
        run: bash web/tools/check-wasi-runtime.sh

      - name: Check MODPACKS builder and native runtime syntax
        run: |
          python3 -m py_compile tools/modpacks.py tools/vinylpacks.py tools/packcheck.py tools/test_packcheck.py
          python3 -m py_compile tools/open_tunnel.py tests/tunnel_patch.py
          python3 tests/tunnel_patch.py
          python3 tools/modpacks.py --help > /dev/null
          python3 tools/vinylpacks.py --help > /dev/null
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/modpacks.c runtime/fileio.c runtime/vinylpacks.c runtime/garage.c runtime/overrides.c runtime/language.c runtime/specialties.c
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/fileio.c
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/roam_game.c runtime/racehorn.c runtime/roam.c runtime/travel.c
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/career.c
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/quickrace.c
          grep -Eq '^RT=.*[[:space:]]quickrace[[:space:]]' web/build.sh
          grep -Eq '^RT=.*[[:space:]]travel([[:space:]]|")' web/build.sh
          grep -Eq '^CSRC=.*[[:space:]]quickrace[[:space:]]' link.sh
          grep -Eq '^CSRC=.*[[:space:]]roam_game[[:space:]]travel[[:space:]]' link.sh
          tools/genstamp.sh hooks | grep -q '0x004aa283'
          grep -Eq '^CSRC=.*[[:space:]]hiddenraces[[:space:]].*[[:space:]]mpcredit_store[[:space:]]mpcredit[[:space:]]' link.sh
          bash -n tests/run_suite.sh tests/checks/mpcreditpending.sh tests/checks/mpcreditrestore.sh
          cc -std=gnu11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/com.c runtime/photo.c runtime/catchup.c runtime/hiddenraces.c runtime/mpcredit.c
          # Compile the browser-only branches too: setting access and guest-memory helpers are WASM-specific.
          cc -std=gnu11 -D__wasm__ -D_POSIX_C_SOURCE=200809L -Iruntime -Iruntime/web/compat -fsyntax-only runtime/com.c runtime/mpcredit.c runtime/mpcredit_store.c
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/hiddenraces_unit.c -o /tmp/hiddenraces_unit
          /tmp/hiddenraces_unit
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/mpcredit_store_unit.c runtime/mpcredit_store.c -o /tmp/mpcredit_store_unit
          /tmp/mpcredit_store_unit
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/quickrace_unit.c -o /tmp/quickrace_unit
          /tmp/quickrace_unit
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/opentunnel_unit.c -o /tmp/opentunnel_unit
          /tmp/opentunnel_unit unset
          /tmp/opentunnel_unit off
          /tmp/opentunnel_unit invalid
          /tmp/opentunnel_unit incomplete
          /tmp/opentunnel_unit empty
          /tmp/opentunnel_unit on
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/modpacks_switch_unit.c -o /tmp/modpacks_switch_unit
          /tmp/modpacks_switch_unit
          # Career unique visual parts: original unlock remains the default; only this predicate is widened.
          cc -std=gnu11 -D_POSIX_C_SOURCE=200809L -Iruntime -fsyntax-only runtime/uniques.c
          cc -std=c11 -Wall -Wextra -Werror -DUNIQUES_UNIT -Iruntime tests/uniques_unit.c runtime/uniques.c -o /tmp/uniques_unit
          /tmp/uniques_unit
          cc -std=c11 -Wall -Wextra -Werror -Iruntime tests/uniques_memory_unit.c runtime/uniques.c -o /tmp/uniques_memory_unit
          /tmp/uniques_memory_unit
          grep -Eq '(^|,)515500(,|$)' <(tools/genstamp.sh overrides)
          grep -Eq '^RT=.*[[:space:]]uniques([[:space:]]|")' web/build.sh
          grep -Eq '^CSRC=.*[[:space:]]uniques([[:space:]]|")' link.sh
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Wno-unused-function -Iruntime tests/catchup_unit.c -o /tmp/catchup_unit
          stdbuf -oL -eL /tmp/catchup_unit

      - name: Run x86 lifter ISA regressions
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'capstone>=5.0.6,<6' 'pefile>=2023.2.7'
          .venv/bin/python tools/isatest.py
          cc -D_GNU_SOURCE -std=c11 -O2 -Iruntime gen/isatest.c runtime/mem.c -pthread -lm -o /tmp/isatest
          /tmp/isatest

      - name: Check multiplayer test-runner syntax
        run: |
          node --check web/tools/online-pair.mjs
          node --check web/tools/roam-pair.mjs
          node --check web/tools/drive-route.mjs

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check WebSocket handshake cancellation regression
        run: node --test web/test/net-trouble.test.mjs

      - name: Check TypeScript
        working-directory: web
        run: npm run check

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Verify Cargo.lock is current
        run: cargo metadata --locked --format-version 1 --manifest-path web/server-rs/Cargo.toml > /dev/null

      - name: Run Rust workspace tests
        run: |
          set -o pipefail
          mkdir -p out/ci
          cargo test --manifest-path web/server-rs/Cargo.toml --workspace 2>&1 | tee out/ci/rust-tests.log

      - name: Format Rust workspace on integration pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/upstream-2026-11-06'
        run: |
          cargo fmt --manifest-path web/server-rs/Cargo.toml --all
          if ! git diff --quiet -- web/server-rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/server-rs
            git commit -m "style: format Rust workspace"
            git push origin HEAD:refs/heads/integration/upstream-2026-11-06
          fi

      - name: Check Rust formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path web/server-rs/Cargo.toml --all -- --check

      - name: Run Rust Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path web/server-rs/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test GPS distance HUD and unit conversion
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime tests/gpsdistance_unit.c -o /tmp/gpsdistance_unit
          /tmp/gpsdistance_unit
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/gpsdistance_hud_unit.c -lm -o /tmp/gpsdistance_hud_unit
          /tmp/gpsdistance_hud_unit
          /tmp/gpsdistance_hud_unit unset
          /tmp/gpsdistance_hud_unit off
          /tmp/gpsdistance_hud_unit false

      - name: Test Photo Mode continuous roll
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime tests/photo_roll_unit.c -lm -o /tmp/photo_roll_unit
          /tmp/photo_roll_unit

      - name: Test Free Roam mailbox layout
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/net_mailbox_layout.c -o /tmp/net_mailbox_layout
          /tmp/net_mailbox_layout

      - name: Test local split-screen layout and shared-weather gating
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iruntime tests/splitscreen_layout_unit.c -o /tmp/splitscreen_layout_unit
          /tmp/splitscreen_layout_unit
          cc -std=c11 -Wall -Wextra -Werror -Iruntime tests/roam_weather_unit.c -o /tmp/roam_weather_unit
          /tmp/roam_weather_unit

      - name: Test Free Roam protocol core (MAPD, NEARREQ and compatibility)
        run: |
          cc -O1 -g -fsanitize=address,undefined -Iruntime tests/roam_unit.c runtime/roam_core.c runtime/roam_bsd.c -lm -o /tmp/roam_unit
          /tmp/roam_unit 50000

      - name: Test custom license plate rendering and HELLO protocol
        run: |
          cc -O1 -g -fsanitize=address,undefined -Iruntime tests/plates_unit.c runtime/plate_image.c runtime/roam_core.c -lm -o /tmp/plates_unit
          /tmp/plates_unit

      - name: Build server binaries for Node integration tests
        run: |
          cargo build --manifest-path web/server-rs/Cargo.toml -p nfsu2-server -p nfsu2-roamload
          mkdir -p out/web/server-rs
          cp web/server-rs/target/debug/nfsu2-server out/web/server-rs/nfsu2-server

      - name: Run synthetic Online protocol load and abuse smoke test
        run: |
          mkdir -p out/ci/fixture-game
          printf 'MZ' > out/ci/fixture-game/SPEED2.EXE
          node web/tools/online-load.mjs --clients 40 --seconds 20 --data "$PWD/out/ci/fixture-game" --out out/ci/online-load --ci

      - name: Focused diagnostics for integration regressions
        id: focused_diagnostics
        continue-on-error: true
        run: |
          status=0
          for file in \
            web/test/page-lifecycle.test.mjs \
            web/test/net-crews.test.mjs \
            web/test/hub-shell-integration.test.mjs \
            web/test/i18n.test.mjs \
            web/test/log-english.test.mjs \
            web/test/packs.test.mjs; do
            node --test --test-reporter=tap "$file" || status=1
          done
          python3 -I tools/test_packcheck.py -v || status=1
          node web/tools/i18n-keys.mjs --check || status=1
          exit "$status"

      - name: Install Chromium for browser-based tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run web regression tests
        timeout-minutes: 35
        run: |
          set -o pipefail
          mkdir -p out/ci
          node --test --test-concurrency=1 --test-timeout=600000 web/test/*.test.mjs 2>&1 | tee out/ci/web-tests.log

      - name: Enforce focused diagnostic result
        if: always()
        env:
          FOCUSED_DIAGNOSTICS_OUTCOME: ${{ steps.focused_diagnostics.outcome }}
        run: |
          if [ "$FOCUSED_DIAGNOSTICS_OUTCOME" = "failure" ]; then
            echo "Focused diagnostics failed; browser regression results are still available above." >&2
            exit 1
          fi

      - name: Keep test logs if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-ci-failure-logs
          path: out/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
