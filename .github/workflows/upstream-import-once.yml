name: One-time upstream import

on:
  push:
    branches:
      - feat/remaining-runtime-features-2026-11
    paths:
      - .github/workflows/upstream-import-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-import-once
  cancel-in-progress: false

jobs:
  import:
    if: github.event.head_commit.message == 'chore: run upstream import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          ref: feat/remaining-runtime-features-2026-11
          fetch-depth: 0

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Import upstream changes with three-way merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/import_upstream.py
