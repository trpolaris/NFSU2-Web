name: WASM Runtime Duplicate Symbol Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wasm-runtime-duplicate-check.yml'
      - 'runtime/com.c'
      - 'runtime/web/**'
      - 'web/build.sh'
      - 'tools/check_runtime_source_ownership.py'
      - 'tests/env_bool_unit.c'
      - 'web/tools/check-wasi-runtime.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wasm-runtime-duplicate-check.yml'
      - 'runtime/com.c'
      - 'runtime/web/**'
      - 'web/build.sh'
      - 'tools/check_runtime_source_ownership.py'
      - 'tests/env_bool_unit.c'
      - 'web/tools/check-wasi-runtime.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasi-runtime:
    name: Verify single-owner WASI runtime objects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check WASI validation script syntax
        run: bash -n web/tools/check-wasi-runtime.sh

      - name: Reject duplicate RT and WEB source ownership
        run: python3 tools/check_runtime_source_ownership.py

      - name: Test browser boolean environment parser
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/env_bool_unit.c -o "$RUNNER_TEMP/env_bool_unit"
          "$RUNNER_TEMP/env_bool_unit"

      - name: Compile runtime files with WASI SDK 34
        run: bash web/tools/check-wasi-runtime.sh
