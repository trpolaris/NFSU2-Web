name: WASM Runtime Duplicate Symbol Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wasm-runtime-duplicate-check.yml'
      - 'web/build.sh'
      - 'runtime/com.c'
      - 'runtime/mprace.c'
      - 'runtime/mprace.h'
      - 'runtime/roam_game.c'
      - 'runtime/intro.c'
      - 'runtime/modpacks.c'
      - 'runtime/dinput_kbd.c'
      - 'runtime/dinput_pad.c'
      - 'runtime/horn.c'
      - 'runtime/horn.h'
      - 'runtime/features.c'
      - 'runtime/photo.c'
      - 'runtime/lightkey.c'
      - 'runtime/garage.c'
      - 'runtime/mpcredit_store.c'
      - 'runtime/web/**'
      - 'runtime/mem.c'
      - 'runtime/overrides.c'
      - 'runtime/guest_span.h'
      - 'web/test/wasm-build-sources.test.mjs'
      - 'runtime/coop.c'
      - 'runtime/drift.c'
      - 'runtime/widescreen.c'
      - 'runtime/widescreen.h'
      - 'runtime/framerate.c'
      - 'runtime/showoff.c'
      - 'runtime/stance.c'
      - 'runtime/savegame.c'
      - 'runtime/split_minimap.inc'
      - 'runtime/travel.c'
      - 'web/test/travel-runtime-integration.test.mjs'
      - 'tests/env_bool_unit.c'
      - 'tools/check_runtime_source_ownership.py'
      - 'web/tools/check-wasi-runtime.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wasm-runtime-duplicate-check.yml'
      - 'web/build.sh'
      - 'runtime/com.c'
      - 'runtime/mprace.c'
      - 'runtime/mprace.h'
      - 'runtime/roam_game.c'
      - 'runtime/intro.c'
      - 'runtime/modpacks.c'
      - 'runtime/dinput_kbd.c'
      - 'runtime/dinput_pad.c'
      - 'runtime/horn.c'
      - 'runtime/horn.h'
      - 'runtime/features.c'
      - 'runtime/photo.c'
      - 'runtime/lightkey.c'
      - 'runtime/garage.c'
      - 'runtime/mpcredit_store.c'
      - 'runtime/web/**'
      - 'runtime/mem.c'
      - 'runtime/overrides.c'
      - 'runtime/guest_span.h'
      - 'web/test/wasm-build-sources.test.mjs'
      - 'runtime/coop.c'
      - 'runtime/drift.c'
      - 'runtime/widescreen.c'
      - 'runtime/widescreen.h'
      - 'runtime/framerate.c'
      - 'runtime/showoff.c'
      - 'runtime/stance.c'
      - 'runtime/savegame.c'
      - 'runtime/split_minimap.inc'
      - 'runtime/travel.c'
      - 'web/test/travel-runtime-integration.test.mjs'
      - 'tests/env_bool_unit.c'
      - 'tools/check_runtime_source_ownership.py'
      - 'web/tools/check-wasi-runtime.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasi-runtime:
    name: Verify single-owner WASI runtime objects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check WASI validation script syntax
        run: bash -n web/tools/check-wasi-runtime.sh

      - name: Reject duplicate RT and WEB source ownership
        run: python3 tools/check_runtime_source_ownership.py
      - name: Test WASM linker configuration and runtime source ownership
        run: node --test web/test/wasm-build-sources.test.mjs web/test/travel-runtime-integration.test.mjs

      - name: Test browser boolean environment parser
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Iruntime tests/env_bool_unit.c -o "$RUNNER_TEMP/env_bool_unit"
          "$RUNNER_TEMP/env_bool_unit"

      - name: Compile runtime files with WASI SDK 34
        run: bash web/tools/check-wasi-runtime.sh
